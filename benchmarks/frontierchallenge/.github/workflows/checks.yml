name: checks

# Guard the boundary between this runtime repository and the two HF datasets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No task payload committed
        run: |
          found=$(git ls-files 'tasks/**' | head -20)
          if [ -n "$found" ]; then
            echo "::error::task payload belongs on Hugging Face, not in Git:"
            echo "$found"
            exit 1
          fi
          echo "no tracked task payload"

      - name: No answer material readable in the clear
        run: python3 scripts/check_public_leaks.py . --allow-empty

      - name: Task set matches the registry
        run: |
          python3 - <<'PY'
          import json
          registry = json.load(open("registry.json"))
          assert registry["n_tasks"] == len(registry["tasks"]) == 97
          assert len({row["id"] for row in registry["tasks"]}) == 97
          print("public registry: 97 unique task commitments")
          PY

      - name: No restricted software redistribution path
        run: python3 scripts/check_restricted_software.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Unit tests
        run: python -m pytest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh shared_images/*.sh; do
            bash -n "$script" || exit 1
          done
          echo "all shell scripts parse"

      - name: Python tooling parses
        run: |
          for script in scripts/*.py tests/*.py; do
            python3 -m py_compile "$script" || exit 1
          done
          echo "all python tooling parses"
