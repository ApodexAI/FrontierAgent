# Interactive agent-team profile used by the terminal UI. `${NAME:-default}`
# reads an environment variable and falls back to the value after `:-`.
# See ../README.md for profile selection and runtime examples.
llm:
  # OpenAI-compatible endpoint used by the coordinator and sub-agents.
  provider: ${OPENAI_PROVIDER:-openai}
  model: ${OPENAI_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  # Higher sampling plus the chat-template flags enables preserved Qwen-style
  # thinking on endpoints (including SGLang) that support these request fields.
  # The triple is the model's generation_config.json. temperature must stay off 0:
  # at 0 sglang takes the argmax path, top_p/top_k stop applying, and a reasoning
  # runaway becomes a deterministic deadlock. See
  # workflows/agent_team/profiles/benchmark.yaml for the measurement.
  temperature: 1.0
  top_p: 0.95
  max_tokens: ${OPENAI_MAX_TOKENS:-32768}
  extra_body:
    top_k: 20
    chat_template_kwargs: {enable_thinking: true, preserve_thinking: true}

report_llm:
  # Separate, deterministic model settings for the optional final report pass.
  provider: ${OPENAI_PROVIDER:-openai}
  model: ${OPENAI_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  # Deliberately 0.0: one tool-free synthesis call, no loop to deadlock in.
  temperature: 0.0
  max_tokens: ${OPENAI_MAX_TOKENS:-32768}
  llm_timeout_s: 600

agent:
  # The TUI returns the coordinator answer directly unless this is changed.
  reporter: false
  reporter_backend: fast
  # Maximum coordinator and per-sub-agent model turns.
  # Raise these for long local runs; tiered compaction below bounds context.
  main_max_turns: ${MAIN_MAX_TURNS:-200}
  sub_max_turns: ${SUB_MAX_TURNS:-100}
  # Per-call timeouts and the research/final-report wall-time budgets, in seconds.
  tool_timeout_s: 360
  llm_timeout_s: 600
  research_wall_time_s: ${RESEARCH_WALL_TIME:-9000}
  # Reasoning-runaway guardrails. Abort a streamed reply that is still only
  # reasoning after 120s or ~16K reasoning tokens, and bound the whole logical
  # call (admission wait + attempts + backoff) at 900s. Setting either
  # reasoning_only key puts the loop on the streaming request path, which is
  # where the watchdog lives; OpenAI-compatible endpoints only.
  # The token cap is load-invariant; the timeout is NOT — it is wall clock, so
  # its token-equivalent shrinks as endpoint concurrency rises (measured
  # single-stream throughput fell from ~204 tok/s at concurrency 1 to ~132 at
  # 120). Raise concurrency and the two keys stop meaning the same thing; the
  # token cap is the one to trust.
  reasoning_only_timeout_s: 120
  reasoning_only_max_tokens: 16384
  logical_call_timeout_s: 900
  wall_deadline_reserve_s: ${REPORT_WALL_TIME:-1800}
  reporter_wall_time_s: 900
  # ``tag`` names the OUTBOUND wire shape, not the inbound parse — the two
  # differ and the name only describes one of them:
  #   inbound  — the typed ``reasoning_content`` channel is preferred whenever
  #              the endpoint separates it (SGLang ``--reasoning-parser qwen3``
  #              does), and the ``<think>…</think>`` regex is only the fallback
  #              for stock SGLang / DashScope, which inline the tags.
  #   outbound — reasoning is re-inlined as ``<think>…</think>`` inside
  #              ``content``, and NO bare ``reasoning_content`` field is sent.
  # That second half is why this must stay ``tag`` for a self-served Qwen-family
  # checkpoint even though the reply arrives on the typed channel: the chat
  # template reconstructs thinking from the tags and does not read an inbound
  # ``reasoning_content`` field, so ``thinking_format: reasoning_content`` would
  # put an unconsumed field on the wire and silently stop reasoning from
  # round-tripping. See ``core/messages.assistant_msg_with_reasoning``.
  thinking_format: tag
  thinking_in_history: true
  # Compact near 80% of max_len; preserve five recent tool results and turns.
  context_compaction: tiered
  # Ephemeral recovery cache, isolated to the current session.
  compaction_spill: ${COMPACTION_SPILL:-true}
  max_len: ${OPENAI_CONTEXT_WINDOW:-262144}
  # Input guard; leave space for OPENAI_MAX_TOKENS and let compaction trigger first.
  max_input_tokens: ${OPENAI_MAX_INPUT_TOKENS:-229376}
  tier1_keep_tool_result: 5
  keep_recent_turns: 5
  # Adds the most thorough coordinator strategy prompt.
  team_effort: max
  # The interactive profile executes immediately rather than using a planning phase.
  planning_mode: false
  # Select legacy web implementations for both coordinator and sub-agents.
  web_search_impl: original
  web_fetch_impl: original
  # Explicit tool allowlists for the coordinator and each sub-agent.
  main_agent_tools: [create_subagent, assign_task, collect_reports, stop_subagent, add_task, update_task, grep_search, glob_search]
  sub_agent_tools: [web_search, web_fetch, submit_report, bash, download_file, grep_search, glob_search, read_file, create_file, recover_result]
  # Warn/escalate when one host repeatedly fails within this many network turns.
  sub_stuck_target_hint_after: 5
  sub_stuck_target_escalate_after: 8
  sub_stuck_target_window: 15
