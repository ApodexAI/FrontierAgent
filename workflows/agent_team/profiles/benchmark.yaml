# Reproducible agent-team benchmark profile. `${NAME:-default}` reads an
# environment variable and uses the value after `:-` when it is unset.
# See ../README.md for when to choose this profile.
llm:
  # OpenAI-compatible endpoint used by the coordinator and sub-agents.
  provider: ${OPENAI_PROVIDER:-openai}
  model: ${OPENAI_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  # ── Sampling: temperature must not be 0 on an agent loop ─────────────────
  # Zero temperature looks like the obvious choice for an evaluation — less
  # run-to-run variance — but on this model it trades occasional divergence for
  # a DETERMINISTIC deadlock. Three measurements:
  #  1) A context already in reasoning-runaway, resampled 4x at temperature 0 on
  #     a self-hosted EAS, returned byte-identical output every time. There is no
  #     probability of leaving the absorbing state. One question accumulated 117
  #     runaways and burned 176 minutes before exiting on `no_tool`.
  #  2) The official endpoint ignores temperature (temp=0 sent 5x returns 5
  #     different results) and therefore escapes. On the same 19 questions:
  #     runaways 516 -> 37, `no_tool` 9/9 -> 0/9, correct 0/9 -> 5/9.
  #  3) It must LEAVE zero, not merely gain top_p/top_k: at temperature 0 sglang
  #     takes the argmax path and does no probabilistic sampling at all, so those
  #     two keys are inert. Adding them without moving temperature does nothing.
  # All three values come from the model's `generation_config.json`. The cost is
  # higher single-run variance, absorbed by averaging over `--runs N`.
  # `top_p` is folded into extra_body by the profile loader; `top_k` is not a
  # Chat-Completions field, so it is passed through extra_body directly.
  temperature: 1.0
  top_p: 0.95
  extra_body:
    top_k: 20
  # Maximum tokens generated by one model call, not the total task budget.
  max_tokens: ${OPENAI_MAX_TOKENS:-32768}

# Optional final-report model. The agent-team-report pipeline enables it by
# default; agent.reporter can explicitly override that routing decision.
report_llm:
  provider: ${OPENAI_PROVIDER:-openai}
  model: ${OPENAI_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  # Deliberately still 0.0, unlike the agent loop above. The deadlock argument
  # does not apply here: the reporter is ONE tool-free synthesis call with no
  # loop to get stuck in, so an absorbing reasoning state has nothing to absorb.
  # Determinism is worth more than escape probability for a final write-up.
  temperature: 0.0
  max_tokens: ${OPENAI_MAX_TOKENS:-32768}
  llm_timeout_s: 600

agent:
  # `fast` is the only shipped reporter backend.
  reporter_backend: fast
  # Maximum coordinator and per-sub-agent model turns.
  main_max_turns: 200
  sub_max_turns: 100
  # Per tool invocation and per LLM request timeouts, in seconds.
  tool_timeout_s: 360
  llm_timeout_s: 600
  # Reasoning-runaway guardrails. Abort a streamed reply that is still only
  # reasoning after 120s or ~16K reasoning tokens, and bound the whole logical
  # call (admission wait + attempts + backoff) at 900s. Setting either
  # reasoning_only key puts the loop on the streaming request path, which is
  # where the watchdog lives; OpenAI-compatible endpoints only.
  # The token cap is load-invariant; the timeout is NOT — it is wall clock, so
  # its token-equivalent shrinks as endpoint concurrency rises (measured
  # single-stream throughput fell from ~204 tok/s at concurrency 1 to ~132 at
  # 120). Raise concurrency and the two keys stop meaning the same thing; the
  # token cap is the one to trust.
  reasoning_only_timeout_s: 120
  reasoning_only_max_tokens: 16384
  logical_call_timeout_s: 900
  # Preserve model reasoning in subsequent requests when the endpoint supports it.
  thinking_in_history: true
  # Optional PER-TURN cap on the reasoning replayed for one assistant turn; it
  # also enables thinking history when the boolean above is omitted. An explicit
  # thinking_in_history: false always takes precedence. This is not a budget
  # over the whole history — total reasoning still grows with turn count, which
  # is compaction's job to bound. Applies to the `tag` and `reasoning_content`
  # thinking formats; native content-block reasoning (Anthropic extended
  # thinking, OpenAI Responses) is always replayed verbatim, signatures
  # included, because the provider validates it server-side.
  # thinking_history_max_tokens: 8192
  # Tiered compaction starts near 80% of max_len, first trimming old tool output
  # and then summarizing history while preserving recent turns.
  context_compaction: tiered
  # Deterministic benchmark memory: no filesystem-backed recovery cache.
  compaction_spill: ${COMPACTION_SPILL:-false}
  max_len: ${OPENAI_CONTEXT_WINDOW:-262144}
  tier1_keep_tool_result: 5
  keep_recent_turns: 5
  # Hard input guard. Keep it below the endpoint context window minus the output
  # allowance, and above 80% of max_len so tiered compaction can trigger first.
  max_input_tokens: ${OPENAI_MAX_INPUT_TOKENS:-229376}
  # Adds the most thorough coordinator strategy prompt.
  team_effort: max
  # Planning is disabled here; the keys below document the available two-phase
  # controls for custom profiles derived from this file.
  planning_mode: false
  planning_max_turns: 40
  fresh_execution_context: false
  # Select legacy (`original`) or tool-schema-aligned web implementations.
  web_search_impl: original
  web_fetch_impl: aligned
  # Explicit allowlists: the coordinator delegates; sub-agents do the research
  # and must call submit_report to return structured findings.
  main_agent_tools: [create_subagent, assign_task, collect_reports, stop_subagent, add_task, update_task, finish_planning, grep_search, glob_search, web_search]
  sub_agent_tools: [web_search, web_fetch, submit_report, bash, download_file, grep_search, glob_search, read_file, create_file, recover_result]
