name: Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/apodexai/frontieragent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          test -n "$image"
          docker pull "$image"
          docker run --rm "$image" --version
          docker run --rm "$image" python tools/import_smoke.py --stage 2

          # GHCR can briefly return 401 for anonymous requests immediately after
          # a public image is pushed. Verify public access separately with retries.
          docker logout ghcr.io
          for attempt in 1 2 3 4 5 6; do
            if docker pull "$image"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Published image is not anonymously pullable: $image"
              exit 1
            fi
            sleep $((attempt * 5))
          done
