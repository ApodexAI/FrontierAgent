name: agent_team
description: "Native Agent Team workflow: coordinator delegates web-enabled work to sub-agents."

workflow: agent_team
# Real, changed 2026-09-05: was `tui`. That profile's own planning_mode:
# false setting was silently, completely disabling two real safeguards --
# the planning-phase tool restriction, and finalize_gate's real
# "did a sub-agent actually do work" verification -- confirmed directly,
# empirically, that this let the coordinator mark real tasks "resolved"
# via update_task with zero actual sub-agent delegation ever happening, in
# real, live test runs across multiple different models. `strict`
# (workflows/agent_team/profiles/strict.yaml) is otherwise identical to
# `tui`, with planning_mode: true.
workflow_profile: strict_single_agent

llm:
  provider: ${OPENAI_PROVIDER:-openai}
  model: ${OPENAI_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  temperature: 1.0
  max_tokens: ${OPENAI_MAX_TOKENS:-32768}
  context_window: ${OPENAI_CONTEXT_WINDOW:-262144}
# Turn budgets live in the selected workflow profile. ``agent.max_turns`` here
# would configure apodex's generic loop, which workflow dispatch does not run.
# The coordinator uses the orchestration tools; its sub-agents receive the
# web/file tools declared in workflows/agent_team/profiles/tui.yaml.
tools: [web_search, web_fetch, bash, grep_search, glob_search, read_file, todo_write]
skills: []
